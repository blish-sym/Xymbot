name: Run Xymbot

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  schedule:
    - cron: "0 */5 * * *" # Automatically restarts every 5 hours to beat the 6-hour limit

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Baileys requires Node 20+

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install

      - name: Create Session
        run: |
          mkdir -p session
          if [ -f "Xymbot-Session.zip" ]; then
            echo "📦 Found Xymbot-Session.zip in repository! Extracting..."
            unzip -o Xymbot-Session.zip -d session/
          elif [ -f "session.zip" ]; then
            echo "📦 Found session.zip in repository! Extracting..."
            unzip -o session.zip -d session/
          else
            echo "🔍 No zip file found. Falling back to SESSION_ID secret..."
            node -e "
              const fs = require('fs');
              let data = process.env.SESSION_ID || '';
              if (data) {
                data = data.replace('XYMBOT~', '').trim();
                fs.writeFileSync('session/creds.json', Buffer.from(data, 'base64'));
                console.log('✅ Session file successfully generated from secret!');
              } else {
                console.log('❌ No session data provided!');
              }
            "
          fi
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}

      - name: Start the Bot
        run: npm start
        env:
          # If users want to use GitHub Secrets instead of config.js, they can put keys here
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
