name: Run Xymbot

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  schedule:
    - cron: "0 */5 * * *" # Automatically restarts every 5 hours to beat the 6-hour limit

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Baileys requires Node 20+

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install

      - name: Create Session
        run: |
          mkdir -p session
          node -e "
            const fs = require('fs');
            let data = process.env.SESSION_ID || '';
            if (data) {
              data = data.replace('XYMBOT~', '').trim();
              try {
                const jsonStr = Buffer.from(data, 'base64').toString('utf8');
                const sessionObj = JSON.parse(jsonStr);
                // Check if this is the old format (just creds.json content)
                if (sessionObj.clientID || sessionObj.me) {
                  fs.writeFileSync('session/creds.json', jsonStr);
                } else {
                  // New format: Multi-file dictionary
                  for (const [filename, content] of Object.entries(sessionObj)) {
                    fs.writeFileSync('session/' + filename, content);
                  }
                }
                console.log('✅ Session successfully generated from secret!');
              } catch(e) {
                // Fallback to raw decoding if it fails to parse as JSON string
                fs.writeFileSync('session/creds.json', Buffer.from(data, 'base64'));
                console.log('✅ Wrote raw creds.json from secret!');
              }
            } else {
              console.log('❌ No SESSION_ID secret found!');
            }
          "
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}

      - name: Run Bot
        run: npm start
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
